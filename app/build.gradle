plugins {
    id 'com.android.application'
}

android {
    namespace "com.google.ar.core.examples.java.principal"
    compileSdk 34

    viewBinding {
        enabled = true
    }

    defaultConfig {
        applicationId "com.google.ar.core.examples.java.principal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/native-image/org.mongodb/bson/native-image.properties'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
   // ARCore para renderização de objetos 3D
    implementation 'com.google.ar:core:1.46.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.12.0' // Extensões Kotlin para melhor compatibilidade

    // ML Kit para reconhecimento de texto
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    implementation 'de.javagl:obj:0.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.ar.sceneform.ux:sceneform-ux:1.17.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'org.mongodb:bson:4.9.1'

    // Outras dependências comuns
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'

    // Retrofit para requisições HTTP
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Dependência do JUnit para testes unitários
    testImplementation 'junit:junit:4.13.2'

    // Dependência do Mockito para testes unitários
    testImplementation 'org.mockito:mockito-core:3.12.4'

    // Dependência do Mockito para testes instrumentados no Android (se necessário)
    androidTestImplementation 'org.mockito:mockito-android:3.12.4'
}
